# Netlify reads this file to know how to build and serve the app.

[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback: every URL (e.g. /history) serves index.html and
# React Router decides which page to show.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and manifest must never be cached by the CDN/browser,
# otherwise phones would keep running an old version of the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Files in /assets have a content hash in their name, so they can be cached
# "forever" – a changed file always gets a new name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app never needs to talk to another origin, so forbid it outright.
# This backs up the privacy promise: logs cannot be sent anywhere.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
