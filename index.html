<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch / Dynamic
         Island; the CSS then adds padding using env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Emotional Trigger Tracker</title>
    <meta
      name="description"
      content="A private, offline tool for noticing which emotions come before an urge."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- iOS "Add to Home Screen" support. iOS ignores most of the web
         manifest for icons, so these tags are still required. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Triggers" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Browser/toolbar tint. main.jsx keeps this in sync with the theme. -->
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />

    <!-- Stop iOS turning numbers in notes into phone links. -->
    <meta name="format-detection" content="telephone=no" />

    <script>
      // Apply a manually chosen theme before the first paint so the page does
      // not flash the wrong colors. Only the theme name is kept here; all
      // personal data lives in IndexedDB.
      try {
        var savedTheme = localStorage.getItem("ett-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        /* localStorage unavailable – the system theme is used instead. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
